name: gisel verify
description: Lint a bundled corpus, generate answerless queries, and compare the frozen suite
inputs:
  corpus:
    description: bundled corpus name (aarch64, arm, m68k, mips, ppc, riscv, spirv, wasm, x86)
    required: false
    default: x86
  target:
    description: suite target for `gisel-ab suite check`
    required: false
    default: x86
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: install
      shell: bash
      run: python -m pip install --quiet gisel gisel-anchor gisel-ab
    - name: lint and generate
      shell: bash
      run: |
        gisel lint --corpus "${{ inputs.corpus }}"
        gisel cases --corpus "${{ inputs.corpus }}" --out "$RUNNER_TEMP/queries.jsonl"
        test -s "$RUNNER_TEMP/queries.jsonl"
    - name: frozen suite
      shell: bash
      run: gisel-ab suite check --target "${{ inputs.target }}"
