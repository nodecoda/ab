name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: ab
          # The release-manifest test walks RELEASE.json's history, and the
          # verification test resolves the cohort tag.
          fetch-depth: 0
          fetch-tags: true
      # The harness only imports `gisel.jsonl` from gisel, but the tests and
      # `env.sh` resolve it as a sibling checkout.
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          # The release-manifest test checks that the recorded cohort commit
          # is an ancestor of this checkout, so the history must be present.
          fetch-depth: 0
          # The tests and the offline suites need the gisel that resolves
          # p0:* per configuration (6671815).  The evidence *record* still
          # names a2005d2: moving that needs a new VERIFICATION.json and
          # cohort tag.  verify-evidence is content-addressed and passes at
          # 6671815; this pin is what the code is checked against, not the
          # historical cohort.
          ref: 6671815aa6799b66943c1760deacff47d3a37bde
      - name: show the gisel pin
        run: git -C gisel rev-parse HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        working-directory: ab
        run: |
          python3 -m pip install -q pytest
          GISEL_SRC="$GITHUB_WORKSPACE/gisel" python3 -m pytest tests -q
      - name: frozen evidence still matches
        working-directory: ab
        run: VERIFY_FROZEN=1 ./verify-evidence.sh
      - name: vertical slice from frozen artifacts
        working-directory: ab
        run: |
          for target in riscv x86 aarch64; do
            python3 vertical.py --target "$target" \
              --out "$RUNNER_TEMP/no-live-artifacts-$target" --verify-only --frozen
          done
      - name: shellcheck the harness entry points
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y shellcheck
          shellcheck -S warning ab/*.sh

  suite:
    # The offline suites answer the frozen queries with the current gisel,
    # independently of the evidence cohort pin above.  `p0:*` resolution and
    # the WIP that this replaces are gisel changes after a2005d2, so this job
    # pins the gisel the suites were checked with instead of moving the
    # evidence record.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ab
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          ref: 6671815aa6799b66943c1760deacff47d3a37bde
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: frozen offline suites
        working-directory: ab
        run: |
          GISEL_SRC="$GITHUB_WORKSPACE/gisel" python3 suite.py check --all
